name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: '公開先（staging = Vercel Preview）'
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hns-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hns-frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --watch=false --runInBand
      - run: npm run test:toolchain

  deploy:
    name: Deploy frontend
    needs: test
    # Only main may use deployment credentials, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: hns-frontend
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Vercel connection
        shell: bash
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name が未設定です。docs/vercel-deployment.md を参照してください。"
              exit 1
            fi
          done
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.2.0 --ignore-scripts
      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Validate public API endpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';
          const env = parseEnv(readFileSync(`.vercel/.env.${process.env.TARGET}.local`, 'utf8'));
          const api = new URL(env.REACT_APP_API_URL || 'http://localhost');
          if (api.protocol !== 'https:' || ['localhost', '127.0.0.1', '::1', '[::1]'].includes(api.hostname) || api.username || api.password) {
            throw new Error('VercelにHTTPSのREACT_APP_API_URLを設定してください。Laravel APIの公開先が必要です。');
          }
          NODE
      - name: Build for Vercel
        shell: bash
        run: |
          flags=()
          if [[ "$TARGET" == production ]]; then flags+=(--prod); fi
          vercel build "${flags[@]}" --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt frontend
        id: deploy
        shell: bash
        run: |
          flags=()
          if [[ "$TARGET" == production ]]; then flags+=(--prod); fi
          url="$(vercel deploy --prebuilt "${flags[@]}" --token="$VERCEL_TOKEN")"
          if [[ ! "$url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo '::error::Vercelの公開URLを取得できませんでした。'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed pages
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          headers=()
          if [[ -n "$BYPASS_SECRET" ]]; then
            headers+=(-H "x-vercel-protection-bypass: $BYPASS_SECRET")
          fi
          for path in / /leaderboard; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --max-time 30 "${headers[@]}" "$DEPLOYMENT_URL$path" -o /tmp/vercel-page.html
            grep -qi '<div id="root"' /tmp/vercel-page.html
          done
      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '### Vercel公開完了\n\n[画面を開く](%s)\n\n公開先: %s\n' "$DEPLOYMENT_URL" "$TARGET" >> "$GITHUB_STEP_SUMMARY"
