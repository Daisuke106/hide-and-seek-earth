services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - '.:/var/www/html'
        environment:
            DB_HOST: mysql
            DB_PORT: '3306'
            DB_DATABASE: '${DB_DATABASE:-hide_and_seek}'
            DB_USERNAME: '${DB_USERNAME:-sail}'
            DB_PASSWORD: '${DB_PASSWORD:-password}'
            REDIS_HOST: redis
        networks:
            - app-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: 'nginx:alpine'
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf'
        networks:
            - app-network
        depends_on:
            - app

    frontend:
        build:
            context: .
            dockerfile: docker/frontend/Dockerfile
        ports:
            - '${FRONTEND_PORT:-3000}:3000'
        volumes:
            - './hns-frontend/src:/app/src'
            - './hns-frontend/public:/app/public'
        environment:
            - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY:-}
            - REACT_APP_API_URL=http://localhost:${APP_PORT:-8000}/api
            - WATCHPACK_POLLING=true
            - CHOKIDAR_USEPOLLING=true
        networks:
            - app-network
        depends_on:
            - nginx

    mysql:
        image: 'mysql:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_DATABASE: '${DB_DATABASE:-hide_and_seek}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
            interval: 10s
            retries: 5
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - app-network
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            retries: 3
            timeout: 5s

networks:
    app-network:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
